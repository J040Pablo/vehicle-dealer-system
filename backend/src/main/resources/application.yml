server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: vehicle-dealer-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dealership_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:${REDIS_HOST:localhost}}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:${REDIS_PORT:6379}}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:${REDIS_PASSWORD:}}}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile
              - openid
            redirect-uri: "${OAUTH2_GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,caches"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
  metrics:
    enable:
      cache: true

app:
  security:
    admin:
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  cache:
    ttl:
      dashboard: ${SPRING_DATA_REDIS_TTL_DASHBOARD:5m}
      viacep: ${SPRING_DATA_REDIS_TTL_VIACEP:24h}
      vehicles: ${SPRING_DATA_REDIS_TTL_VEHICLES:10m}
      dealers: ${SPRING_DATA_REDIS_TTL_DEALERS:10m}
      filters: ${SPRING_DATA_REDIS_TTL_FILTERS:15m}

logging:
  level:
    root: INFO
    com.dealership.api: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO_CORRELATION}] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

viacep:
  url: ${VIACEP_URL:https://viacep.com.br/ws}
  connect-timeout: 3000
  read-timeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    enabled: ${AWS_DYNAMODB_ENABLED:true}
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    audit-table: ${AWS_DYNAMODB_AUDIT_TABLE:VehicleDealerAuditLogs}
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    bucket-name: ${AWS_S3_BUCKET_NAME:vehicle-dealer-images}
    public-url-prefix: ${AWS_S3_PUBLIC_URL_PREFIX:}

