server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: vehicle-dealer-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dealership_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,caches"
  endpoint:
    health:
      show-details: "always"
  health:
    redis:
      enabled: false
  metrics:
    enable:
      cache: true

app:
  cache:
    ttl:
      dashboard: ${SPRING_DATA_REDIS_TTL_DASHBOARD:5m}
      viacep: ${SPRING_DATA_REDIS_TTL_VIACEP:24h}
      vehicles: ${SPRING_DATA_REDIS_TTL_VEHICLES:10m}
      dealers: ${SPRING_DATA_REDIS_TTL_DEALERS:10m}
      filters: ${SPRING_DATA_REDIS_TTL_FILTERS:15m}

logging:
  level:
    root: INFO
    com.dealership.api: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-NO_CORRELATION}] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

viacep:
  url: ${VIACEP_URL:https://viacep.com.br/ws}
  connect-timeout: 3000
  read-timeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  expiration: ${JWT_EXPIRATION:86400000}

