server:
  servlet:
    context-path: /api

spring:
  test:
    database:
      replace: NONE
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=YEAR,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cache:
    type: simple
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  oauth2:
    authorized-redirect-uri: http://localhost:5173/oauth2/redirect

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,caches"
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
  expiration: 86400000
